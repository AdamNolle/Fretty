name: Fretty
options:
  bundleIdPrefix: com.adamnolle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: RSDJXF7DXN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fretty:
    type: application
    platform: iOS
    sources:
      - path: Fretty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamnolle.fretty
        PRODUCT_NAME: Fretty
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fretty
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Fretty listens for the note names you say when you answer a quiz by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Fretty turns the note names you say into quiz answers. Recognition runs on your iPhone when supported.
    info:
      path: Fretty/Info.plist
      properties:
        UIAppFonts:
          - Figtree.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
          - NotoMusic-Regular.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
